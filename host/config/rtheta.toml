protocol_version = 1
# serial_svmdを使う機体では、[serial_svmd]と[[serial_svmd.servos]]を追加する。

# 立ち上げ用の安全側の上限。能力確認の直後にcctlへ送られる。
# ゲインは机上値のままなので、実機で挙動を確かめながら緩めていく。
# FWはRAM保持なので、ここを直してhostを起動し直せば反映される。
[parameters]
# M3508: 位置ループが出す速度指令と、C620へ出す電流を絞る。
m3508_max_rpm = 500.0
m3508_max_current_ma = 1000.0
# EL05: ドライバ内の速度制限と電流制限。設定時にモータへ書き込まれる。
el05_limit_spd = 1.0
el05_limit_cur = 2.0
# DM: 位置速度モードの速度上限。z軸は重力負荷があるので特に低速から。
dm_pos_vel_limit = 1.0

[[axes]]
name = "r"
unit = "mm"
slot = 0
input_axis = 1
input_sign = 1.0
speed_per_second = 100.0
native_per_unit = 0.10005072
minimum = 0.0
maximum = 120.0
initial = 0.0
# スイッチ取付後に origin_position = 120.0 へ戻す。
# 前進しきるとビーム後端がSW1を叩き、そこが可動域の最大側になる。
origin_position = 0.0

# リミットスイッチ未取付のため無効。取り付けたら有効化する。
# 接点はB接点配線で、未接続だと「開＝到達」と判定されて前進できなくなる。
# [axes.limit]
# input = 0
# direction = 1.0

[[axes]]
name = "theta"
unit = "deg"
slot = 1
input_axis = 0
input_sign = 1.0
speed_per_second = 90.0
native_per_unit = 140.82353
minimum = -180.0
maximum = 180.0
initial = 0.0
# 赤青コートで取り付けを共用できないためスイッチは持たない。
# セッティングで姿勢を合わせ、GUIから原点を採る。
origin_position = 0.0

[[axes]]
name = "z"
unit = "mm"
slot = 2
input_axis = 3
input_sign = 1.0
# 重力負荷があるので低速から始める。実機で詰める。
speed_per_second = 30.0
native_per_unit = 0.15707964
minimum = 0.0
maximum = 75.0
initial = 0.0
origin_position = 0.0

# リミットスイッチ未取付のため無効。取り付けたら有効化する。
# 下端でSW2に当たる。
# [axes.limit]
# input = 1
# direction = -1.0
